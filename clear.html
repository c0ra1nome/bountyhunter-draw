<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清除抽獎紀錄</title>
<style>
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#212529;background:#fff;line-height:1.7}
h1{background:#282828;color:#fff;padding:12px 18px;font-size:22px}
.box{border:1px solid #d5d5d5;padding:16px 20px;margin:16px 0}
button{background:#f4811f;color:#fff;border:0;padding:12px 24px;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.ok{color:#1b7f3b;font-weight:700}.warn{color:#d32f2f;font-weight:700}
</style>
</head>
<body>
<h1>清除抽獎紀錄</h1>
<p class="warn">請先關掉「獎金獵人抽獎機」的分頁，再按下方按鈕。</p>
<div class="box" id="info">讀取中…</div>
<button id="go">清除全部抽獎紀錄</button>
<p id="msg"></p>
<script>
const KEY='bh-lucky-draw-v1';
const emptyBook=()=>({records:[],log:[],seq:0,rid:0});
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function show(){
  const s=read();
  if(!s||!s.books){document.getElementById('info').textContent='這個瀏覽器裡找不到抽獎機的資料。請確認你平常是用這個瀏覽器開抽獎機。';document.getElementById('go').disabled=true;return}
  document.getElementById('info').innerHTML=`活動：${s.event&&s.event.name||'（未命名）'}<br>正式紀錄：${s.books.real.records.length} 筆抽出、${s.books.real.log.length} 筆過程<br>測試紀錄：${s.books.test.records.length} 筆抽出、${s.books.test.log.length} 筆過程<br>名單鎖定：${s.lock?'已鎖定':'未鎖定'}<br><small>名單和獎項會保留。</small>`;
}
document.getElementById('go').onclick=()=>{
  const s=read();if(!s)return;
  s.books={real:emptyBook(),test:emptyBook()};s.lock=null;if(s.stage)s.stage.prizeId='';
  localStorage.setItem(KEY,JSON.stringify(s));
  show();
  document.getElementById('msg').innerHTML='<span class="ok">已清除。</span>現在可以重新打開抽獎機了。';
  document.getElementById('go').disabled=true;
};
show();
</script>
</body>
</html>
